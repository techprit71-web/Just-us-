<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Just Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================================================
     SETUP — read this before opening the app
     ============================================================
     1. Go to https://console.firebase.google.com and create a free
        project (any name, e.g. "just-us").
     2. In the left menu open "Build > Firestore Database" and click
        "Create database". Choose "Start in test mode" (fine for a
        private app between two people).
     3. Click the gear icon (Project settings) > scroll to "Your apps"
        > click the "</>" (web) icon > register an app (any nickname,
        no hosting needed). Firebase will show you a firebaseConfig
        object.
     4. Copy those values into FIREBASE_CONFIG below, replacing the
        placeholders.
     5. Save this file, then host it somewhere simple both phones can
        open, e.g.:
          - GitHub Pages (free), or
          - Firebase Hosting itself, or
          - a free static host like Netlify Drop.
        (Opening it as a local file also works for quick testing, but
        a real web link is what you'll want to add to your home screen.)
     6. Open the link on your phone, tap your browser's menu, and
        choose "Add to Home Screen" — now it behaves like an app icon.
     7. You and your wife both open it, each type the SAME private
        code (anything you like, e.g. "US2026"), and you're connected.
     ============================================================ -->
<script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD4CrTUuCXEGuhTZZAbKGo9VM9t5f4kKp8",
    authDomain: "betweenus-4e7f4.firebaseapp.com",
    projectId: "betweenus-4e7f4",
    storageBucket: "betweenus-4e7f4.firebasestorage.app",
    messagingSenderId: "248525233003",
    appId: "1:248525233003:web:a4e9ed903e6a0a88f30a2e"
  };
</script>

<style>
  :root{
    --bg: #FBF7F2;
    --surface: #FFFFFF;
    --ink: #2A2438;
    --muted: #8A8494;
    --primary: #C1447E;
    --primary-ink: #FFFFFF;
    --bubble-hers: #EDE6F5;
    --line: #ECE4DC;
    --online: #5FA777;
  }
  *{ box-sizing: border-box; }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
  }
  h1,h2,h3, .display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  #app{ height:100dvh; display:flex; flex-direction:column; }
  .screen{ display:none; height:100%; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Onboarding ---------- */
  #screen-onboarding{ align-items:center; justify-content:center; padding:24px; }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px;
    width:100%;
    max-width:380px;
  }
  .card h1{ font-size:28px; margin:0 0 4px; }
  .card p.sub{ margin:0 0 24px; color:var(--muted); font-size:14px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .field input[type=text]{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--bg);
    font-size:16px;
    color:var(--ink);
    font-family:inherit;
  }
  .field input[type=text]:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .avatar-picker{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .avatar-picker .avatar{ width:56px; height:56px; }
  .avatar-picker button{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 14px;
    font-size:13px;
    color:var(--ink);
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    background:var(--primary);
    color:var(--primary-ink);
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.45; }
  .hint{ font-size:12px; color:var(--muted); margin-top:14px; text-align:center; line-height:1.5; }

  /* ---------- Avatar ---------- */
  .avatar{
    width:40px; height:40px; border-radius:50%;
    background:var(--bubble-hers);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:16px;
    color:var(--primary);
    overflow:hidden;
    flex-shrink:0;
    position:relative;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Chat header ---------- */
  #chat-header{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    flex-shrink:0;
  }
  #chat-header .who{ flex:1; min-width:0; }
  #chat-header .who .name{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; }
  #chat-header .who .status{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.online{ background:var(--online); }

  /* ---------- Messages ---------- */
  #messages{
    flex:1;
    overflow-y:auto;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .empty-state{ margin:auto; text-align:center; color:var(--muted); font-size:14px; padding:30px; }
  .bubble-row{ display:flex; }
  .bubble-row.mine{ justify-content:flex-end; }
  .bubble{
    max-width:74%;
    padding:10px 13px;
    border-radius:16px;
    font-size:15px;
    line-height:1.4;
    word-wrap:break-word;
  }
  .bubble-row.mine .bubble{
    background:var(--primary); color:#fff; border-bottom-right-radius:5px;
  }
  .bubble-row.theirs .bubble{
    background:var(--bubble-hers); color:var(--ink); border-bottom-left-radius:5px;
  }
  .bubble img{ display:block; width:100%; max-width:220px; border-radius:10px; margin-bottom:4px; }
  .bubble .time{ font-size:10.5px; opacity:0.65; margin-top:3px; display:block; }

  /* ---------- Input bar ---------- */
  #input-bar{
    display:flex; align-items:flex-end; gap:8px;
    padding:10px 12px;
    border-top:1px solid var(--line);
    background:var(--surface);
    flex-shrink:0;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #input-bar button.icon-btn{
    width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg);
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  #text-input{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:20px;
    padding:11px 15px;
    font-size:15px;
    font-family:inherit;
    max-height:100px;
    background:var(--bg);
    color:var(--ink);
  }
  #text-input:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  #send-btn{
    width:42px; height:42px; border-radius:50%;
    border:none; background:var(--primary); color:#fff;
    font-size:16px; flex-shrink:0; cursor:pointer;
  }
  #send-btn:disabled{ opacity:0.4; }

  /* ---------- Photo reveal overlay ---------- */
  #photo-reveal{
    position:fixed; inset:0; background:rgba(20,16,26,0.88);
    display:none; align-items:center; justify-content:center;
    flex-direction:column; z-index:50; padding:30px;
    animation:fadeIn 0.25s ease;
  }
  #photo-reveal.show{ display:flex; }
  #photo-reveal img{ max-width:92vw; max-height:70vh; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
  #photo-reveal .caption{ color:#fff; font-family:'Fraunces', serif; font-size:18px; margin-top:16px; }
  #photo-reveal .tap-hint{ color:rgba(255,255,255,0.6); font-size:13px; margin-top:6px; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }

  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  #toast.show{ opacity:1; }

  input[type=file]{ display:none; }
</style>
</head>
<body>
<div id="app">

  <!-- ONBOARDING -->
  <div id="screen-onboarding" class="screen active">
    <div class="card">
      <h1>Just Us</h1>
      <p class="sub">A private space for the two of you. No sign up — just a code only you two know.</p>

      <div class="avatar-picker">
        <div class="avatar" id="pfp-preview">+</div>
        <button id="pfp-btn" type="button">Choose photo</button>
        <input type="file" id="pfp-input" accept="image/*">
      </div>

      <div class="field">
        <label for="name-input">Your name</label>
        <input type="text" id="name-input" placeholder="e.g. Sam" maxlength="20">
      </div>

      <div class="field">
        <label for="code-input">Private code</label>
        <input type="text" id="code-input" placeholder="e.g. US2026" maxlength="16" style="text-transform:uppercase">
      </div>

      <button class="btn-primary" id="join-btn">Enter</button>
      <p class="hint">Pick any code and share it with her however you like (text, in person). Whoever enters it next lands in the same private chat.</p>
    </div>
  </div>

  <!-- CHAT -->
  <div id="screen-chat" class="screen">
    <div id="chat-header">
      <div class="avatar" id="partner-avatar">?</div>
      <div class="who">
        <div class="name" id="partner-name">Waiting…</div>
        <div class="status"><span class="dot" id="partner-dot"></span><span id="partner-status">Waiting for her to join</span></div>
      </div>
    </div>

    <div id="messages">
      <div class="empty-state" id="empty-state">Say hello 👋</div>
    </div>

    <div id="input-bar">
      <button class="icon-btn" id="photo-btn" title="Send a photo">📷</button>
      <input type="file" id="photo-input" accept="image/*">
      <textarea id="text-input" rows="1" placeholder="Message"></textarea>
      <button id="send-btn">➤</button>
    </div>
  </div>

</div>

<div id="photo-reveal">
  <img id="photo-reveal-img" src="">
  <div class="caption" id="photo-reveal-caption"></div>
  <div class="tap-hint">Tap anywhere to close</div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ---------- local identity ----------
let myId = localStorage.getItem('ju_myId');
if(!myId){ myId = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('ju_myId', myId); }

let myName = localStorage.getItem('ju_name') || '';
let myPhoto = localStorage.getItem('ju_photo') || '';
let roomCode = localStorage.getItem('ju_code') || '';

let partnerId = null;
let initialMessagesLoaded = false;
let heartbeatTimer = null;

// ---------- helpers ----------
function initials(name){ return (name||'?').trim().charAt(0).toUpperCase() || '?'; }

function setAvatarEl(el, name, photo){
  el.innerHTML = '';
  if(photo){
    const img = document.createElement('img');
    img.src = photo;
    el.appendChild(img);
  } else {
    el.textContent = initials(name);
  }
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = height * (maxDim/width); width = maxDim; }
        else if(height >= width && height > maxDim){ width = width * (maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function relativeTime(date){
  if(!date) return '';
  const s = Math.floor((Date.now() - date.getTime())/1000);
  if(s < 45) return 'just now';
  if(s < 3600) return Math.floor(s/60) + ' min ago';
  if(s < 86400) return Math.floor(s/3600) + ' hr ago';
  if(s < 172800) return 'yesterday';
  return date.toLocaleDateString([], {month:'short', day:'numeric'});
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function showPhotoReveal(dataUrl, name){
  document.getElementById('photo-reveal-img').src = dataUrl;
  document.getElementById('photo-reveal-caption').textContent = name + ' sent a photo';
  document.getElementById('photo-reveal').classList.add('show');
}
document.getElementById('photo-reveal').addEventListener('click', () => {
  document.getElementById('photo-reveal').classList.remove('show');
});

// ---------- onboarding ----------
const pfpInput = document.getElementById('pfp-input');
document.getElementById('pfp-btn').addEventListener('click', () => pfpInput.click());
pfpInput.addEventListener('change', async () => {
  if(!pfpInput.files[0]) return;
  const dataUrl = await resizeImage(pfpInput.files[0], 220, 0.75);
  myPhoto = dataUrl;
  setAvatarEl(document.getElementById('pfp-preview'), myName, myPhoto);
});

document.getElementById('name-input').value = myName;
document.getElementById('code-input').value = roomCode;
if(myPhoto) setAvatarEl(document.getElementById('pfp-preview'), myName, myPhoto);

document.getElementById('join-btn').addEventListener('click', async () => {
  const name = document.getElementById('name-input').value.trim();
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if(!name || !code){ showToast('Enter your name and a code'); return; }
  myName = name; roomCode = code;
  localStorage.setItem('ju_name', myName);
  localStorage.setItem('ju_photo', myPhoto);
  localStorage.setItem('ju_code', roomCode);

  try { if('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch(e){}

  enterChat();
});

// auto-rejoin if we already have saved info
if(myName && roomCode){
  // still show onboarding pre-filled; user taps Enter. (Kept explicit so a shared device doesn't auto-join.)
}

// ---------- chat ----------
function enterChat(){
  document.getElementById('screen-onboarding').classList.remove('active');
  document.getElementById('screen-chat').classList.add('active');

  const roomRef = db.collection('rooms').doc(roomCode);
  roomRef.set({ createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });

  // my presence doc
  const myPresenceRef = roomRef.collection('presence').doc(myId);
  const setOnline = (online) => myPresenceRef.set({
    name: myName, photo: myPhoto, online,
    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });

  setOnline(true);
  heartbeatTimer = setInterval(() => { if(!document.hidden) setOnline(true); }, 20000);
  document.addEventListener('visibilitychange', () => setOnline(!document.hidden));
  window.addEventListener('beforeunload', () => setOnline(false));

  // watch presence subcollection for partner
  roomRef.collection('presence').onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      const id = change.doc.id;
      if(id === myId) return;
      const data = change.doc.data();
      partnerId = id;
      setAvatarEl(document.getElementById('partner-avatar'), data.name, data.photo);
      document.getElementById('partner-name').textContent = data.name || 'Her';
      const dot = document.getElementById('partner-dot');
      const statusEl = document.getElementById('partner-status');
      if(data.online){
        dot.classList.add('online');
        statusEl.textContent = 'Online';
      } else {
        dot.classList.remove('online');
        const seen = data.lastSeen && data.lastSeen.toDate ? data.lastSeen.toDate() : null;
        statusEl.textContent = seen ? ('Last seen ' + relativeTime(seen)) : 'Offline';
      }
    });
  });

  // refresh "last seen X ago" text periodically
  setInterval(() => {
    const statusEl = document.getElementById('partner-status');
    if(!statusEl.textContent.startsWith('Last seen')) return;
    roomRef.collection('presence').doc(partnerId).get().then(doc => {
      if(!doc.exists) return;
      const data = doc.data();
      if(!data.online && data.lastSeen && data.lastSeen.toDate){
        statusEl.textContent = 'Last seen ' + relativeTime(data.lastSeen.toDate());
      }
    });
  }, 30000);

  // messages
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty-state');
  roomRef.collection('messages').orderBy('createdAt', 'asc').limitToLast(200)
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if(change.type !== 'added') return;
        const data = change.doc.data();
        renderMessage(data);
        if(initialMessagesLoaded && data.sender !== myId && data.type === 'image'){
          showPhotoReveal(data.imageData, document.getElementById('partner-name').textContent);
          if(document.hidden && 'Notification' in window && Notification.permission === 'granted'){
            new Notification(document.getElementById('partner-name').textContent + ' sent a photo', { body:'Tap to open Just Us' });
          }
        }
        if(initialMessagesLoaded && data.sender !== myId && document.hidden && data.type === 'text' && 'Notification' in window && Notification.permission === 'granted'){
          new Notification(document.getElementById('partner-name').textContent, { body:data.text });
        }
      });
      if(!initialMessagesLoaded){
        initialMessagesLoaded = true;
        if(messagesEl.children.length > 1) emptyEl.remove();
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

  function renderMessage(data){
    if(document.getElementById('empty-state')) document.getElementById('empty-state').remove();
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (data.sender === myId ? 'mine' : 'theirs');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if(data.type === 'image'){
      const img = document.createElement('img');
      img.src = data.imageData;
      bubble.appendChild(img);
    }
    if(data.text){
      const p = document.createElement('div');
      p.textContent = data.text;
      bubble.appendChild(p);
    }
    const time = document.createElement('span');
    time.className = 'time';
    const d = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date();
    time.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    bubble.appendChild(time);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  // sending text
  const textInput = document.getElementById('text-input');
  const sendBtn = document.getElementById('send-btn');
  function send(){
    const text = textInput.value.trim();
    if(!text) return;
    roomRef.collection('messages').add({
      sender: myId, type:'text', text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    textInput.value = '';
    textInput.style.height = 'auto';
  }
  sendBtn.addEventListener('click', send);
  textInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  textInput.addEventListener('input', () => {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
  });

  // sending photo
  const photoInput = document.getElementById('photo-input');
  document.getElementById('photo-btn').addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', async () => {
    if(!photoInput.files[0]) return;
    showToast('Sending photo…');
    const dataUrl = await resizeImage(photoInput.files[0], 900, 0.65);
    roomRef.collection('messages').add({
      sender: myId, type:'image', imageData: dataUrl,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    photoInput.value = '';
  });
}
</script>
</body>
</html>
